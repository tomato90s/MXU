name: build

on:
  push:
    tags:
      - "v*"
    branches:
      - "main"
      - "custom"

  pull_request:
    branches:
      - "main"
      - "custom"

  workflow_dispatch:
    inputs:
      version:
        description: "版本号 (如 0.2.1-custom.1)，留空则不发布 Release"
        required: false
        default: ""
      prerelease:
        description: "是否为预发布版本"
        type: boolean
        required: false
        default: false

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      is-release: ${{ steps.version.outputs.is-release }}
      is-prerelease: ${{ steps.version.outputs.is-prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get version
        id: version
        run: |
          IS_RELEASE="false"
          IS_PRERELEASE="false"

          # 1. workflow_dispatch 手动输入版本号
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
            TAG="v${{ github.event.inputs.version }}"
            IS_RELEASE="true"
            if [[ "${{ github.event.inputs.prerelease }}" == "true" ]]; then
              IS_PRERELEASE="true"
            fi
          # 2. tag 触发
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            TAG="${GITHUB_REF#refs/tags/}"
            IS_RELEASE="true"
            # 自动检测预发布版本（tag 包含 -alpha, -beta, -rc, -dev）
            if [[ "$TAG" =~ -(alpha|beta|rc|dev|preview|pre) ]]; then
              IS_PRERELEASE="true"
            fi
          else
            VERSION="0.0.0-dev"
            TAG="dev"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "is-release=$IS_RELEASE" >> $GITHUB_OUTPUT
          echo "is-prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
          echo "Version: $VERSION, Tag: $TAG, Release: $IS_RELEASE, Prerelease: $IS_PRERELEASE"

  windows:
    needs: meta
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x86_64, aarch64]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "pnpm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch == 'x86_64' && 'x86_64-pc-windows-msvc' || 'aarch64-pc-windows-msvc' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          shared-key: "windows-${{ matrix.arch }}"
          cache-on-failure: true

      - name: Install frontend dependencies
        run: pnpm install

      - name: Update version
        shell: bash
        run: |
          VERSION="${{ needs.meta.outputs.version }}"
          # Update package.json
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" package.json
          # Update tauri.conf.json
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
          # Update Cargo.toml (only the package version at line start, not dependency versions)
          sed -i "s/^version = \"[^\"]*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          echo "Updated version to $VERSION"

      - name: Build Tauri app
        run: pnpm tauri build --no-bundle --target ${{ matrix.arch == 'x86_64' && 'x86_64-pc-windows-msvc' || 'aarch64-pc-windows-msvc' }}

      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir -p install
          TARGET_DIR="src-tauri/target/${{ matrix.arch == 'x86_64' && 'x86_64-pc-windows-msvc' || 'aarch64-pc-windows-msvc' }}/release"
          cp -r "$TARGET_DIR/mxu.exe" install/ || true
          cp -r "$TARGET_DIR/mxu.pdb" install/ || true
          cp LICENSE README.md install/ || true
          ls -la install/

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: MXU-win-${{ matrix.arch }}-${{ needs.meta.outputs.tag }}
          path: "install"

  linux:
    needs: meta
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x86_64]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "pnpm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          shared-key: "linux-${{ matrix.arch }}"
          cache-on-failure: true

      - name: Install frontend dependencies
        run: pnpm install

      - name: Update version
        run: |
          VERSION="${{ needs.meta.outputs.version }}"
          # Update package.json
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" package.json
          # Update tauri.conf.json
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
          # Update Cargo.toml (only the package version at line start, not dependency versions)
          sed -i "s/^version = \"[^\"]*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          echo "Updated version to $VERSION"

      - name: Build Tauri app
        run: pnpm tauri build --no-bundle

      - name: Prepare artifacts
        run: |
          mkdir -p install
          cp -r src-tauri/target/release/mxu install/ || true
          cp LICENSE README.md install/ || true
          ls -la install/
          tar -czvf MXU-linux-${{ matrix.arch }}-${{ needs.meta.outputs.tag }}.tar.gz -C install .

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: MXU-linux-${{ matrix.arch }}-${{ needs.meta.outputs.tag }}
          path: "MXU-linux-${{ matrix.arch }}-${{ needs.meta.outputs.tag }}.tar.gz"

  macos:
    needs: meta
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [x86_64, aarch64]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "pnpm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch == 'x86_64' && 'x86_64-apple-darwin' || 'aarch64-apple-darwin' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          shared-key: "macos-${{ matrix.arch }}"
          cache-on-failure: true

      - name: Install frontend dependencies
        run: pnpm install

      - name: Update version
        run: |
          VERSION="${{ needs.meta.outputs.version }}"
          # Update package.json
          sed -i '' "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" package.json
          # Update tauri.conf.json
          sed -i '' "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
          # Update Cargo.toml (only the package version at line start, not dependency versions)
          sed -i '' "s/^version = \"[^\"]*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          echo "Updated version to $VERSION"

      - name: Build Tauri app
        run: pnpm tauri build --no-bundle --target ${{ matrix.arch == 'x86_64' && 'x86_64-apple-darwin' || 'aarch64-apple-darwin' }}

      - name: Prepare artifacts
        run: |
          mkdir -p install
          cp -r src-tauri/target/${{ matrix.arch == 'x86_64' && 'x86_64-apple-darwin' || 'aarch64-apple-darwin' }}/release/mxu install/ || true
          cp LICENSE README.md install/ || true
          ls -la install/
          tar -czvf MXU-macos-${{ matrix.arch }}-${{ needs.meta.outputs.tag }}.tar.gz -C install .

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: MXU-macos-${{ matrix.arch }}-${{ needs.meta.outputs.tag }}
          path: "MXU-macos-${{ matrix.arch }}-${{ needs.meta.outputs.tag }}.tar.gz"

  changelog:
    name: Generate changelog
    needs: meta
    runs-on: ubuntu-latest
    outputs:
      release_body: ${{ steps.git-cliff.outputs.content }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Avoid orhun/git-cliff-action single-shot curl to GitHub Releases (502s are common).
      - name: Install git-cliff
        run: |
          set -euo pipefail
          GC_VER="2.13.1"
          TARBALL="git-cliff-${GC_VER}-x86_64-unknown-linux-gnu.tar.gz"
          URL="https://github.com/orhun/git-cliff/releases/download/v${GC_VER}/${TARBALL}"
          for attempt in 1 2 3 4 5 6; do
            rm -f "/tmp/${TARBALL}"
            if curl -fL --connect-timeout 30 --max-time 180 \
              --retry 8 --retry-all-errors --retry-delay 5 \
              -o "/tmp/${TARBALL}" "$URL"; then
              break
            fi
            echo "git-cliff download failed (attempt ${attempt}), backing off..."
            sleep $((attempt * 20))
          done
          test -s "/tmp/${TARBALL}"
          EXTRACT="/tmp/git-cliff-extract"
          rm -rf "$EXTRACT"
          mkdir -p "$EXTRACT"
          tar -xzf "/tmp/${TARBALL}" -C "$EXTRACT"
          BIN="$(find "$EXTRACT" -type f -name git-cliff | head -1)"
          test -n "$BIN" && test -x "$BIN"
          sudo install -m 755 "$BIN" /usr/local/bin/git-cliff
          git-cliff --version

      - name: Generate a changelog
        id: git-cliff
        env:
          GITHUB_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git-cliff -vv --latest --strip header --config .github/cliff.toml > CHANGES.md
          {
            echo 'content<<CLIFF_EOF'
            cat CHANGES.md
            echo 'CLIFF_EOF'
          } >> "$GITHUB_OUTPUT"

  release:
    if: ${{ needs.meta.outputs.is-release == 'true' }}
    needs: [meta, windows, linux, macos, changelog]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts

      - name: Package artifacts
        run: |
          cd artifacts
          for dir in */; do
            name="${dir%/}"
            cd "$name"
            # Linux and macOS artifacts are already tgz files, just move them
            if ls *.tar.gz 1> /dev/null 2>&1; then
              mv *.tar.gz ../
            else
              # Windows artifacts need to be zipped
              zip -r "../${name}.zip" .
            fi
            cd ..
          done
          ls -la

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: Release ${{ needs.meta.outputs.tag }}
          draft: false
          prerelease: ${{ needs.meta.outputs.is-prerelease == 'true' }}
          body: |
            ${{ needs.changelog.outputs.release_body }}
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
